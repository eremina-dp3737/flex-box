<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ref</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }
        body {
            height: 100%;
            display:flex;
            flex-direction: column;
        }
        header {
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            background-color: rgb(58, 90, 248);
            color: aliceblue;
            font-family:Arial, Helvetica, sans-serif;
        }
        h1 {
            font-size: 20px;
            font-weight: bolder;
            
        }
        a {
            color: aliceblue;
            font-size: 13px;
            padding: 5px;
            text-decoration: none;
        }
        main {
            background-color: rgb(238, 235, 235);
            padding: 20px;
        }
        h2 {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
        }
        h3 {
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: lighter;
        }
        .box {
            color: rgb(58, 90, 248);
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
            background-color:rgb(255, 254, 251);
            padding: 20px 20px;
            width: 160px;
            border-radius: 7px;
            box-shadow: 2px 2px 10px 0px rgb(203, 203, 203);



        }
        .text{
            color: rgb(0, 0, 0);
            font-weight: lighter;
            padding: 10px;
        }
        .code {
            color:black;
            font-weight: lighter;
            padding: 7px;
            background-color:rgb(238, 235, 235);
            border-radius: 7px;
            
        }
       
    </style>
</head>
<body>
    <header>
        <h1>FlexStudy</h1>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Уроки</a>
            <a href="#">Практика</a>
        </nav>
    </header>
    <main>
        <h2>Изучаем Flexbox</h2>
        <h3>Простая страница для студентов, которые только начинают изучать Flexbox.</h3>
        <div class="box">
            <h4>display: flex</h4>
            <h5 class="text">Превращает элемент в flex-контейнер. Его дочерние элементы становятся flex-элементами</h5>
            <h6 class="code"><code>display: flex;</code></h6>
        </div>

    </main>
    <footer></footer>
</body>
</html>
